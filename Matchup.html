<!-- MAIN-BAR -->
<video autoplay muted loop playsinline class="bgvid"><source src="background.mp4" type="video/mp4"></video>
<main class="stage">
  <h1 class="title">Choose your <span>fighters</span></h1>
  <div class="picker">
    <input id="char1" list="chars" autocomplete="off" placeholder="Character 1">
    <img src="vs-transparent.png" class="vs" alt="VS">
    <input id="char2" list="chars" autocomplete="off" placeholder="Character 2">
  </div>
  <button id="startBtn" class="go">⚔ Start Matchup</button>
  <p id="error" class="error"></p>
  <section id="arena" class="arena" hidden>
    <div class="fighter left" id="fa"></div>
    <img class="clash" src="vs-transparent.png" alt="VS">
    <div class="fighter right" id="fb"></div>
  </section>
  <p id="status"></p>
  <section id="result" class="result" hidden></section>
</main>
<script src="./characters.js"></script>
<script src="./auth.js"></script>
<script src="./Matchup.js"></script>
