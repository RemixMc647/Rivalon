<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rivalon | Sign Up</title>
  <link rel="stylesheet" href="./SignUp.css" />
  <link rel="shortcut icon" href="./renox-logo-32x32.png" type="image/x-icon">
</head>
<body>
  <div class="background"></div>

  <form id="signupform" class="main-bar">
    <h2 class="text1">Create your <span class="span1">R</span>ivalon account</h2>
    <h3 class="text2">Enter your details below ⬇</h3>

    <input type="text" placeholder="User Name" id="username" class="input1" required />
    <input type="email" placeholder="Email Address" id="email" class="input1" required />
    <input type="password" placeholder="Password" id="password" class="input1" required />
    <input type="password" placeholder="Confirm Password" id="confirmPassword" class="input1" required />

    <button class="button1" type="submit">Sign Up</button>

    <div class="part1">
      <h3 class="text3">Already have an account?</h3>
      <a href="./Login.html" class="Login">Login</a>
    </div>
  </form>
  <script src="./auth.js"></script>
  <script src="./SignUp.js"></script>
</body>
</html>
